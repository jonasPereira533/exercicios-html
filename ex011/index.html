<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <title> Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir essa imagem em dispositivos diferentes ou simplesmente diminua o tamanho do seu navegador</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/ImagemP.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/ImagemM.png" type="image/png">
        <img src="imagens/ImagemG.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzir audios em HTML5</p>
    <audio preload="metadata" controls>
        <source src="midia/Kreezy%20Millz%20-Peguei%20No%20Mambo.mp3.mp3" type="audio/mpeg">
        <source src="midia/Kreezy%20Millz%20-Peguei%20No%20Mambo.mp3.mp3" type="audio/ogg">
        <source src="midia/Kreezy%20Millz%20-Peguei%20No%20Mambo.mp3.mp3" type="audio/wav">
        <p>Infelizmente o seu navegador não conseguiu reproduzir o audio,
            clique <a href="midia/Kreezy%20Millz%20-Peguei%20No%20Mambo.mp3.mp3">aqui para baixar </a></p>
    </audio>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Esse vídeo está hospetado no meu servidor</p>
    <video width="560" poster="imagem/imagem.jpg" controls>
        <source src="midia/video.mp4" type="video/mp4">
        <source src="midia/Video1.webm" type="video/webm">
    </video>

    <h1>Inserindo videos do YouTube </h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/XtwD48odALo?si=lP0kBVyc8Xtpjwvg"
            title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write;
            encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen></iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Posição dos fundos</title>
    <style>
        div.bloco {
            background-image: url("img/wallpaper003.jpg");
            height: 200px;
            border: 1px solid black;
            border-radius: 20px;
            margin: 10px;
        }

        div#div01 {
            background-position: left top;
        }
        div#div02 {
            background-position: left center;
        }
        div#div03 {
            background-position: right bottom;
        }
        div#div04 {
            background-position: center center;
        }
    </style>
</head>
<body>
    <div class="bloco" id="div01">
    </div>

    <div class="bloco" id="div02">
    </div>

    <div class="bloco" id="div03">
    </div>

    <div class="bloco" id="div04">
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Listas</title>
    <link rel="shortcut icon" href="icone-code.ico" type="image/x-icon">
</head>
<body>
    <h1>Trabalhando com listas</h1>
    <h2>Listas ordenadas</h2>

    <ol type="1">
        <li>Acordar
        <li>Tomar banho
        <li>Estudar
        <li>Tomar café da manhã
        <li>Começar a trabalhar
    </ol>

    <h2>Listas não ordenadas</h2>
    <ul>
        <li>Feijão
        <li>Bacon
        <li>Calabresa
        <li>Cheiro verde
        <li>Torresmo
    </ul>
</body>
</html>

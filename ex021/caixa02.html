<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Grouping Tags</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #b1afaf;
            margin: 0;
        }
        header {
            background-color: #8d8c8c;
            padding: 20px;
            margin: 20px;
        }
        nav {
            background-color: #f1e2e2;
            padding: 3px;
        }

        nav a {
            text-decoration: none;
            color: #0e0e0e;
            font-weight: bold;
            margin-right: 30px;
        }
        nav a:hover {
            text-decoration: underline;
        }

        main {
            background-color: #8d8c8c;
            padding: 20px;
            margin: 20px;
        }
        article {
            background-color: #f6f4f4;
            padding: 5px;
            font-weight: bold;
        }
        footer {
            background-color: #303030;
            color: white;
            text-align: center;
            padding: 1px;
            margin: 0px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu site</h1>
    <nav>
        <a href="https://www.lipsum.com/">link</a>
        <a href="https://www.lipsum.com/">link</a>
        <a href="https://www.lipsum.com/">link</a>
        <a href="https://www.lipsum.com/">link</a>
    </nav>
    </header>

    <main>
        <section id="Assunto">
            <h2>Esportes Tecnologia Política</h2>
        </section>
        <section id="Noticias">
            <article>
                <h3>Noticias sobre o Brasil</h3>
                <p>It is a long established fact that a reader will be distracted by the readable content of a page
                    when looking at its layout.</p>
                <aside>
                    <p>Artigo escrito por José Da Silva</p>
                </aside>
            </article>
        </section>

    </main>

    <footer>
    <p>Desenvolvido por Jonas</p>
    </footer>
</body>
</html>

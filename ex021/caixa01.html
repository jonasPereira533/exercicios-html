<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Modelos de caixas</title>
    <style>
        h1  {
            background-color: #b9b9b9;
            height: 300px;
            width: 300px;

            border: 10px solid darkseagreen;

            padding: 10px;

            margin: 20px auto 40px auto;

            outline: 5px dashed #8181f5 ;
        }

        a {
            border-width: 10px;
            border-style: solid;
            border-color: #f31111;
        }
    </style>
</head>
<body>
    <h1>Exemplo de box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">Links são exemplos de inline-level</a>.
        Vamos ver como isso funciona</p>
</body>
</html>
